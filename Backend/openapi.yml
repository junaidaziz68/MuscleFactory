openapi: 3.0.0
info:
  title: MuscleFactory API
  description: >-
    API collection for MuscleFactory backend testing. The login request
    automatically saves the received JWT token to the collection variables for
    use in subsequent authenticated requests.
  version: 1.0.0
servers:
  - url: undefined://{{baseUrl}}
tags:
  - name: Auth
  - name: Workouts
  - name: Exercises
  - name: Diet Plans
  - name: Food & Water Logs
  - name: Tracker Checkins
paths:
  /api/register:
    post:
      tags:
        - Auth
      summary: Register User
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                username: testuser
                email: testuser@example.com
                password: password123
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/login:
    post:
      tags:
        - Auth
      summary: Login User
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: test@test.com
                password: password
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/profile:
    get:
      tags:
        - Auth
      summary: Get Profile
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/workouts:
    get:
      tags:
        - Workouts
      summary: Get Workouts
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: date
          in: query
          schema:
            type: string
          description: 'Optional: Filter by date (YYYY-MM-DD)'
          example: '2026-03-13'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Workouts
      summary: Create Workout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Push Day
                date: '2026-03-13'
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/workouts/1:
    put:
      tags:
        - Workouts
      summary: Update Workout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Updated Push Day
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
        - Workouts
      summary: Delete Workout
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/exercises:
    get:
      tags:
        - Exercises
      summary: Get Exercises
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: workout_id
          in: query
          schema:
            type: integer
          description: 'Optional: Filter by workout_id'
          example: '1'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Exercises
      summary: Add Exercise to Workout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                workout_id: 1
                name: Bench Press
                sets: 3
                reps: 10
                weight: 80
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/exercises/1:
    put:
      tags:
        - Exercises
      summary: Update Exercise
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Bench Press
                sets: 4
                reps: 8
                weight: 85
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
        - Exercises
      summary: Delete Exercise
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/diet-plans:
    get:
      tags:
        - Diet Plans
      summary: Get Diet Plans
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Diet Plans
      summary: Create Diet Plan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: My New Diet
                diet_style: high_protein
                meals_count: 3
                meals:
                  - name: Breakfast
                    ingredients:
                      - Eggs
                      - Oats
                    calories: 500
                    macros:
                      protein: 30
                      carbs: 50
                      fats: 20
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/food-logs:
    get:
      tags:
        - Food & Water Logs
      summary: Get Food Logs
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: date
          in: query
          schema:
            type: string
          example: '2026-03-13'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Food & Water Logs
      summary: Add Food Log
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                date: '2026-03-13'
                meal_type: breakfast
                name: Oatmeal
                amount: 1
                unit: bowl
                calories: 300
                protein: 10
                carbs: 50
                fats: 5
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/water-logs:
    get:
      tags:
        - Food & Water Logs
      summary: Get Water Logs
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: date
          in: query
          schema:
            type: string
          example: '2026-03-13'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Food & Water Logs
      summary: Add Water Log
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                date: '2026-03-13'
                amount: 500
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/checkins:
    get:
      tags:
        - Tracker Checkins
      summary: Get Checkins
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: date
          in: query
          schema:
            type: string
          example: '2026-03-13'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/checkins/weight:
    post:
      tags:
        - Tracker Checkins
      summary: Log Weight
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                date: '2026-03-13'
                weight: 75.5
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/checkins/photo:
    post:
      tags:
        - Tracker Checkins
      summary: Upload Progress Photo
      requestBody:
        content: {}
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
